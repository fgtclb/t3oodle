services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\T3oodle\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  FGTCLB\T3oodle\Extbase\TypeConverter\BasePollObjectConverter:
    tags:
      - name: extbase.type_converter
        priority: 2
        target: \FGTCLB\T3oodle\Domain\Model\BasePoll
        sources: int,string,array
